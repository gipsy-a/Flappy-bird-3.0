<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird dengan Pipa Bertekstur Klasik</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #70c5ce;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let gameStarted = false;
let score = 0;
let highscore = localStorage.getItem("highscore") ? parseInt(localStorage.getItem("highscore")) : 0;

const bird = {
    x: 50,
    y: 300,
    radius: 14,
    gravity: 0.4,
    velocity: 0,
    jump: -6.5,
    draw: function() {
        // --- 1. WINGS BACK ---
        let wingOffset = this.velocity < 0 ? -6 : 4;
        ctx.beginPath();
        ctx.ellipse(this.x - 6, this.y + wingOffset, 10, 6, (this.velocity * 0.05), 0, Math.PI * 2);
        ctx.fillStyle = "#fff"; 
        ctx.fill();
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.closePath();

        // --- 2. BIRD BODY ---
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#ff4444";
        ctx.fill();
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.closePath();

        // --- 3. EYES ---
        ctx.beginPath();
        ctx.arc(this.x + 6, this.y - 4, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.closePath();

        ctx.beginPath();
        ctx.arc(this.x + 7, this.y - 4, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = "#000";
        ctx.fill();
        ctx.closePath();

        // --- 4. YELLOW BEAK ---
        ctx.beginPath();
        ctx.moveTo(this.x + 12, this.y - 2);
        ctx.lineTo(this.x + 24, this.y + 2);
        ctx.lineTo(this.x + 12, this.y + 6);
        ctx.fillStyle = "#ffff00";
        ctx.fill();
        ctx.stroke();
        ctx.closePath();
    }
};

const pipes = [];
const pipeWidth = 60;
const pipeSpeed = 2;
const pipeGap = bird.radius * 2 * 2.8; 

// --- DYNAMIC CLOUDS MANAGEMENT ---
const clouds = [];
function spawnCloud(initialX = canvas.width) {
    clouds.push({
        x: initialX,
        y: Math.floor(Math.random() * 120) + 30,
        speed: Math.random() * 0.4 + 0.2,
        scale: Math.random() * 0.4 + 0.7
    });
}

spawnCloud(40);
spawnCloud(180);
spawnCloud(320);

function spawnPipe() {
    const minHeight = 50;
    const maxHeight = canvas.height - pipeGap - minHeight;
    const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
    pipes.push({
        x: canvas.width,
        top: topHeight,
        passed: false
    });
}

function resetGame() {
    score = 0;
    bird.y = 300;
    bird.velocity = 0;
    pipes.length = 0;
    gameStarted = false;
    
    clouds.length = 0;
    spawnCloud(40);
    spawnCloud(180);
    spawnCloud(320);
}

function handleControl() {
    if (!gameStarted) {
        gameStarted = true;
    }
    bird.velocity = bird.jump;
}

window.addEventListener("keydown", function(e) {
    if (e.code === "Space") handleControl();
});

canvas.addEventListener("touchstart", function(e) {
    e.preventDefault();
    handleControl();
});

canvas.addEventListener("mousedown", handleControl);

// Helper function to draw textured arcade pipes
function drawTexturedPipe(x, y, width, height, isTop) {
    // 1. Create a lighting gradient structure across the width of the pipe
    let grad = ctx.createLinearGradient(x, 0, x + width, 0);
    grad.addColorStop(0, "#4d901e");   // Dark shadow left side
    grad.addColorStop(0.2, "#73bf2e"); // Base bright green
    grad.addColorStop(0.4, "#b3ef63"); // Light highlight streak
    grad.addColorStop(0.7, "#73bf2e"); // Transition back
    grad.addColorStop(1, "#366615");   // Dark shadow right side

    // 2. Draw Main Pipe Shaft
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, width, height);
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2.5;
    ctx.strokeRect(x, y, width, height);

    // 3. Draw Extra Accent Texture Lines (Shading Details)
    ctx.fillStyle = "rgba(255, 255, 255, 0.25)"; // Specular line
    ctx.fillRect(x + Math.floor(width * 0.25), y, 3, height);
    ctx.fillStyle = "rgba(0, 0, 0, 0.15)";       // Core shadow line
    ctx.fillRect(x + Math.floor(width * 0.75), y, 4, height);

    // 4. Draw Overhanging Lip/Cap Configuration
    const capHeight = 24;
    const capExtraWidth = 6; // Sticks out past the shaft width
    const capX = x - capExtraWidth;
    let capY = isTop ? (y + height - capHeight) : y;

    // Gradient for the cap
    let capGrad = ctx.createLinearGradient(capX, 0, capX + width + (capExtraWidth * 2), 0);
    capGrad.addColorStop(0, "#5fa825");
    capGrad.addColorStop(0.3, "#91e03c");
    capGrad.addColorStop(0.5, "#d6ff94"); // Pop highlight
    capGrad.addColorStop(0.8, "#73bf2e");
    capGrad.addColorStop(1, "#29520e");

    ctx.fillStyle = capGrad;
    ctx.fillRect(capX, capY, width + (capExtraWidth * 2), capHeight);
    ctx.strokeRect(capX, capY, width + (capExtraWidth * 2), capHeight);
    
    // Border line inside cap connection point
    ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
    let shadowY = isTop ? capY : capY + capHeight - 4;
    ctx.fillRect(capX, shadowY, width + (capExtraWidth * 2), 4);
}

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Background Langit
    ctx.fillStyle = "#70c5ce";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // DRAW AND MOVE CLOUDS
    for (let i = clouds.length - 1; i >= 0; i--) {
        let cloud = clouds[i];
        cloud.x -= cloud.speed; 

        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(cloud.x, cloud.y, 30 * cloud.scale, 0, Math.PI * 2);
        ctx.arc(cloud.x + (40 * cloud.scale), cloud.y - (10 * cloud.scale), 40 * cloud.scale, 0, Math.PI * 2);
        ctx.arc(cloud.x + (80 * cloud.scale), cloud.y, 30 * cloud.scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.closePath();

        if (cloud.x + (120 * cloud.scale) < 0) {
            clouds.splice(i, 1);
            spawnCloud(); 
        }
    }

    if (gameStarted) {
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;

        if (bird.y + bird.radius >= canvas.height || bird.y - bird.radius <= 0) {
            resetGame();
        }

        if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
            spawnPipe();
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
            pipes[i].x -= pipeSpeed;

            const bottomPipeY = pipes[i].top + pipeGap;
            const bottomPipeHeight = canvas.height - bottomPipeY;

            // Render Textured Top Pipe
            drawTexturedPipe(pipes[i].x, 0, pipeWidth, pipes[i].top, true);

            // Render Textured Bottom Pipe
            drawTexturedPipe(pipes[i].x, bottomPipeY, pipeWidth, bottomPipeHeight, false);

            // Collision check
            if (
                bird.x + bird.radius > pipes[i].x &&
                bird.x - bird.radius < pipes[i].x + pipeWidth
            ) {
                if (bird.y - bird.radius < pipes[i].top || bird.y + bird.radius > bottomPipeY) {
                    resetGame();
                    break;
                }
            }

            // Score check
            if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                pipes[i].passed = true;
                score++;
                if (score > highscore) {
                    highscore = score;
                    localStorage.setItem("highscore", highscore);
                }
            }

            // Remove offscreen pipes
            if (pipes[i].x + pipeWidth < 0) {
                pipes.splice(i, 1);
            }
        }
    } else {
        ctx.fillStyle = "#fff";
        ctx.font = "20px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Tekan Layar/Spasi untuk Mulai", canvas.width / 2, canvas.height / 2);
    }

    bird.draw();

    // Score UI
    ctx.fillStyle = "#fff";
    ctx.lineWidth = 4;
    ctx.font = "bold 30px Arial";
    ctx.textAlign = "center";
    ctx.strokeStyle = "#000";
    ctx.strokeText(score, canvas.width / 2, 50);
    ctx.fillText(score, canvas.width / 2, 50);

    if (highscore > 0) {
        ctx.font = "bold 16px Arial";
        ctx.strokeText("Highscore: " + highscore, canvas.width / 2, 85);
        ctx.fillText("Highscore: " + highscore, canvas.width / 2, 85);
    }

    requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
